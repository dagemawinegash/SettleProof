[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "settleproof"
version = "0.1.0"
description = "A sandboxed reconciliation coding agent with independent source checks"
requires-python = ">=3.11"
dependencies = ["python-dotenv>=1,<2", "psycopg[binary]>=3.2,<4"]

[project.optional-dependencies]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.18"]
dev = ["httpx>=0.27,<1", "playwright>=1.48,<2"]

[project.scripts]
settleproof = "settleproof.cli:main"

[tool.setuptools.packages.find]
include = ["settleproof*"]

[tool.setuptools.package-data]
settleproof = ["sandbox_runner.py", "web/*", "web/fonts/*"]
